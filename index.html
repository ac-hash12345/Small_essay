<body>
<div class="app"><header class="top"><div class="topin"><button class="btn nav-toggle" id="nav-toggle" type="button" aria-controls="essay-nav" aria-expanded="true">收起目录</button><div class="brand">考研英语作文背诵助手<small>逐句理解 · 听读 · 挖空 · 默写</small></div><div class="progress"><div class="bar"><i id="pbar"></i></div><div class="ptxt" id="ptxt">学习进度 0%</div></div><button class="btn" id="theme-toggle" type="button" aria-pressed="false" onclick="toggleTheme()">深色</button></div></header>

<script>

const LOCAL_ZH=Object.fromEntries(`behalf|代表\nunion|联合会；学生会\nextend|表达；给予\nheartfelt|衷心的\noverseas|海外的；留学生的\npractical|实用的\nsuggestion|建议\nprestigious|有声望的；知名的\nperhaps|也许\nexpect|预期；期待\ntightly|紧紧地\nbound|受约束的\ndaily|每日的\nabundant|大量的；丰富的\nfrequent|频繁的\nprepared|准备好的\nhectic|繁忙的\nspite|尽管\nburden|负担\nextracurricular|课外的\nspeech|演讲\ncontest|比赛\ngathering|聚会\nample|充足的\nopportunity|机会\nesteemed|受尊敬的；著名的\npressure|压力\nworthwhile|值得的；有意义的\nenhance|提升；增添\nkeen|热衷的\nancient|古代的\nnovel|小说\nromance|传奇；演义\nkingdom|王国\nplanning|计划\ndirect|执导；直接的\nrevised|改编的；修订的\nclassical|古典的\ndepict|描写\npolitical|政治的\nmilitary|军事的\nstruggle|斗争\nreveal|揭示\nturbulent|动荡的\nportray|塑造；描绘\nimage|形象\ncharacter|人物；角色\nexcel|擅长\nacting|表演\ncordially|诚挚地\ninvite|邀请\nparticipate|参加\nleading|主要的；主演的\nhero|主人公；英雄\nreply|回复\nrecommend|推荐；介绍\ncelebrity|名人\nthinker|思想家\neducator|教育家\nfounder|创始人\nconfucianism|儒家思想\nsage|圣人；贤者\nspring|春季；春秋时期的春\nautumn|秋季；春秋时期的秋\nrecorded|记录的\ndisciple|弟子\nanalects|论语\nenduring|持久的；不朽的\nculture|文化\ninfluence|影响\npolitician|政治家\nconfucian|儒家的\nremain|仍然；保持\nregular|经常的；常客\npassenger|乘客\ndisappointed|失望的\nprovided|提供的\nrecently|最近\nsatisfactory|令人满意的\ntherefore|因此\ndraw|引起；吸引\nattention|关注\nissue|问题\nimprove|改进\npunctuality|准时\nessential|至关重要的\nrailway|铁路\ndelayed|延误的\nfrequently|频繁地\ninconvenience|不便\nattitude|态度\non-board|车上的\nstaff|工作人员\nembody|体现\nprinciple|原则\ncustomer|顾客\nconsideration|考虑\nmanagement|管理\nsystem|系统\nimprovement|改进\nprofessor|教授\nlanguage|语言\nexpert|专家\ninspire|启发；鼓舞\navailable|有空的；可用的\nallocate|分配\nsession|环节；会议\ngratitude|感激\nrefer|指的是；提及\nunfortunate|不幸的\naccident|事故\nknocked|撞倒的\ntaxi|出租车\ntimely|及时的\nassistance|帮助\nfirst aid|急救\nconsequence|后果\nquick-witted|机智的\nresponse|反应；回应\nemergency|紧急情况\noutcome|结果\nmounting|不断增加的\nunselfish|无私的\npractice|践行；练习\npreach|宣扬；说教\nattend|参加\ninterview|面试\nunfortunately|不幸地\ndiagnosed|被诊断的\ninfection|感染\nrequire|需要\nsurgery|手术\npostpone|推迟\napologize|道歉\nhearing|收到消息；听力\ncaused|造成的\nexcuse|原谅；借口\napply|申请；应用\nposit function isZh(s){return /[\u3400-\u9fff]/.test(s)} function isEnglish(s){return /[A-Za-z]{2}/.test(s)&&!isZh(s)}
function clean(s){return s.replace(/^\s*[①②③④⑤⑥⑦⑧⑨⑩]\s*/,'').trim()}
function parse(txt){
 const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean), out=[]; let cur=null,mode='';
 for(let i=0;i<lines.length;i++){let x=lines[i];
  if(/第[一二三四五六七八九十百0-9]+篇[:：]/.test(x)){if(cur)out.push(cur);cur={title:x.replace(/^第.+?篇[:：]\s*/,''),source:x,pairs:[],full:[]};mode='';continue}
  if(!cur)continue;if(x.includes('中英逐句对照版')){mode='pairs';continue} if(x.includes('完整纯英文版')){mode='full';continue} if(x.includes('完整中文版')){mode='done';continue}
  if(mode==='pairs'&&isEnglish(x)){let y=lines[i+1];if(y&&isZh(y)){cur.pairs.push({en:clean(x),zh:clean(y)});i++}}
  else if(mode==='full'&&isEnglish(x))cur.full.push(clean(x));
 }
 if(cur)out.push(cur); return out.filter(e=>e.pairs.length||e.full.length)
}
function fullText(e){return (e.full.length?e.full:e.pairs.map(p=>p.en)).join('\n\n')}
function wordsHtml(text,ctx){return text.split(/([A-Za-z]+(?:['’\-][A-Za-z]+)*)/g).map((w,i)=>i%2===0?esc(w):`<span class="word" data-word="${w}" data-context="${esc(ctx)}">${w}</span>`).join('')}
function renderList(q=''){const list=S.essays.map((e,i)=>({e,i})).filter(o=>(o.e.title+' '+fullText(o.e)).toLowerCase().includes(q.toLowerCase()));$('#list').innerHTML=list.map(o=>`<button class="essay ${o.i===S.current?'active':''}" data-i="${o.i}"><b>${esc(o.e.title)}</b><span>${o.e.pairs.length} 个对照句</span></button>`).join('');document.querySelectorAll('.essay').forEach(b=>b.onclick=()=>{stopSpeak();S.current=+b.dataset.i;S.tab='study';render()})}
function render(){renderList($('#search').value);const e=S.essays[S.current];if(!e)return;let content='';
 if(S.tab==='study')content=`<div class="${S.hideZh?'hidezh':''}">${e.pairs.map((p,i)=>`<div class="sentence"><div class="en">${wordsHtml(p.en,p.zh)}</div><div class="zh">${esc(p.zh)}</div><button class="btn sentenceSpeak" title="朗读本句" aria-label="朗读本句" data-index="${i}">🔊</button><button class="btn sentence-star" type="button" data-index="${i}" onclick="toggleStar(this)"></button></div>`).join('')}</div>`;
 if(S.tab==='recite')content=`<div class="toolbar"><button class="btn" onclick="toggleAllRecite(true)">显示全部英文</button><button class="btn" onclick="toggleAllRecite(false)">隐藏全部英文</button></div>${e.pairs.map((p,i)=>`<div class="reciteRow"><div class="reciteZh">${esc(p.zh)}</div><button class="btn" onclick="document.getElementById('ra${i}').classList.toggle('show')">看答案</button><div class="reciteAnswer" id="ra${i}">${wordsHtml(p.en,p.zh)}</div></div>`).join('')}`;
 if(S.tab==='cloze')content=e.pairs.map((p,i)=>`<div class="sentence"><div class="en">${cloze(p.en,i)}</div><div class="zh">${esc(p.zh)}</div></div>`).join('')+`<p class="notice">点击横线可显示或隐藏单词。</p>`;
 if(S.tab==='dictation')content=`<textarea id="writing" placeholder="根据中文或记忆，在这里默写英文全文…"></textarea><div class="toolbar"><button class="btn green" onclick="checkWriting()">核对默写</button><button class="btn" onclick="toggleAnswer()">显示参考答案</button><button class="btn" onclick="clearWriting()">清空</button></div><div class="score" id="score" style="display:none"></div><div class="answer" id="answer">${esc(fullText(e))}</div>`;

function cloze(text,seed){let n=0;return esc(text).replace(/([A-Za-z]+(?:['’\-][A-Za-z]+)*)/g,w=>{n++;let hide=w.length>5&&(n+seed)%3===0;return hide?`<span class="clozeWord" onclick="this.classList.toggle('reveal')">${w}</span>`:w})}
function toggleAllRecite(show){document.querySelectorAll('.reciteAnswer').forEach(x=>x.classList.toggle('show',show));bindWords()}
function bindWords(){document.querySelectorAll('.word').forEach(w=>w.onclick=()=>openDict(w.dataset.word,w.dataset.context))}
const preferences = readLocal('essay_preferences', {});
S.rate = [0.75, 0.9, 1, 1.15].includes(preferences.rate) ? preferences.rate : 0.9;
document.documentElement.classList.toggle('dark', preferences.dark === true);
$('#theme-toggle').setAttribute('aria-pressed', String(preferences.dark === true));

function readLocal(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}

function writeLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch { /* The current session remains usable if storage is unavailable. */ }
}

function setRate(value) {
  S.rate = preferences.rate = Number(value);
  if (activeAudio) activeAudio.playbackRate = S.rate;
  writeLocal('essay_preferences', preferences);
}

function toggleTheme() {
  preferences.dark = !preferences.dark;
  document.documentElement.classList.toggle('dark', preferences.dark);
  $('#theme-toggle').setAttribute('aria-pressed', String(preferences.dark));
  writeLocal('essay_preferences', preferences);
}

function draftKey() {
  return 'essay_draft:' + S.essays[S.current].source;
}

function toggleStar(button) {
  const stars = readLocal('essay_stars', {});
  const key = S.essays[S.current].source + ':' + button.dataset.index;
  const starred = !stars[key];
  if (starred) stars[key] = true;
  else delete stars[key];
  writeLocal('essay_stars', stars);
  updateStar(button, starred);
}

function updateStar(button, starred) {
  button.setAttribute('aria-pressed', String(starred));
  button.setAttribute('aria-label', starred ? '取消本句星标' : '标星本句');
  button.textContent = starred ? '★' : '☆';
}

function lookupWord(word) {
  const key = word.toLowerCase().replaceAll('’', "'");
  const irregular = {felt:'feel', held:'hold', found:'find', spent:'spend', made:'make', written:'write', took:'take'};
  const forms = [key, irregular[key]];
  if (key.endsWith("'s")) forms.push(key.slice(0, -2));
  if (key.endsWith('ies')) forms.push(key.slice(0, -3) + 'y');
  if (key.endsWith('es')) forms.push(key.slice(0, -2), key.slice(0, -1));
  else if (key.endsWith('s')) forms.push(key.slice(0, -1));
  for (const suffix of ['ed', 'ing']) {
    if (!key.endsWith(suffix)) continue;
    const stem = key.slice(0, -suffix.length);
    forms.push(stem, stem + 'e');
    if (stem.endsWith('i')) forms.push(stem.slice(0, -1) + 'y');
    if (/(.)\1$/.test(stem)) forms.push(stem.slice(0, -1));
  }
  return forms.find(form => Object.hasOwn(LOCAL_ZH, form) || Object.hasOwn(wordNotes, form)) || key;
}

function openDict(word, ctx) {
  const key = lookupWord(word);
  const note = Object.hasOwn(wordNotes, key) ? wordNotes[key] : null;
  const cached = readLocal('essay_word_cache', {})[word.toLowerCase()];
  const meaning = Object.hasOwn(LOCAL_ZH, key) ? LOCAL_ZH[key] : '词表暂无释义，可参考所在句的翻译。';
  $('#dictword').textContent = word;
  const normalized = word.toLowerCase().replaceAll('’', "'");
  const ipa = offlineIpa[normalized] || cached?.phon || (normalized === key && note ? '/' + note.ipa + '/' : '');
  $('#phon').textContent = [ipa, note?.pos].filter(Boolean).join(' · ');
  $('#meaning').textContent = meaning;
  $('#word-note').textContent = note ? (key !== word.toLowerCase() ? '原形：' + key + ' · ' : '') + note.example + (Object.hasOwn(writingTips, key) ? '。' + writingTips[key] : '') : '';
  $('#word-note').hidden = !note;
  $('#context').textContent = '所在句译文：' + ctx;
  $('#dict').classList.add('show');
  $('#speakWord').onclick = () => speakText(word, 'https://dict.youdao.com/dictvoice?type=2&audio=' + encodeURIComponent(word));
  $('#addVocab').textContent = vocab().some(entry => entry.key === key) ? '已加入生词本' : '加入生词本';
  $('#addVocab').onclick = () => addVocab(key, word, ctx, meaning);
}

function closeDict() {
  $('#dict').classList.remove('show');
}

let audioManifest = {};
let activeAudio;
let speechRequest = 0;
let audioTimer;

function stopSpeak() {
  speechRequest++;
  clearTimeout(audioTimer);
  if (activeAudio) {
    activeAudio.pause();
    activeAudio.removeAttribute('src');
    activeAudio.load();
    activeAudio = null;
  }
  window.speechSynthesis?.cancel();
  const status = $('#audio-status');
  if (status) status.textContent = '';
}

function speakSystem(text, request) {
  const synth = window.speechSynthesis;
  if (!synth) {
    if ($('#audio-status')) $('#audio-status').textContent = '当前浏览器无法朗读，可尝试用系统浏览器打开。';
    return;
  }
  const status = $('#audio-status');
  if (status) status.textContent = '正在使用浏览器语音朗读…';
  const american = synth.getVoices().filter(voice => voice.lang.toLowerCase() === 'en-us');
  const voice = american.find(voice => /natural|neural|samantha/i.test(voice.name)) || american[0];
  const parts = text.length > 200 ? text.match(/[^.!?]+[.!?]+[”"']?(?=\s|$)|[^.!?]+$/g) : null;
  const segments = parts?.join('').replace(/\s/g, '') === text.replace(/\s/g, '') ? parts : [text];
  let next = 0;
  function playNext() {
    if (request !== speechRequest) return;
    if (next >= segments.length) {
      if ($('#audio-status')) $('#audio-status').textContent = '';
      return;
    }
    const utterance = new SpeechSynthesisUtterance(segments[next++].trim());
    utterance.lang = 'en-US';
    utterance.rate = S.rate;
    if (voice) utterance.voice = voice;
    utterance.onend = playNext;
    utterance.onerror = () => {
      if (request === speechRequest && $('#audio-status')) $('#audio-status').textContent = '浏览器语音播放失败，请检查设备的英语语音设置。';
    };
    synth.speak(utterance);
  }
  playNext();
}

function speakText(text, url) {
  stopSpeak();
  const request = speechRequest;
  if (!url) return speakSystem(text, request);
  const audio = new Audio();
  activeAudio = audio;
  audio.playbackRate = S.rate;
  const fallback = () => {
    if (request !== speechRequest || activeAudio !== audio) return;
    stopSpeak();
    speakSystem(text, speechRequest);
  };
  audio.addEventListener('error', fallback, {once: true});
  audio.addEventListener('playing', () => {if (activeAudio === audio) clearTimeout(audioTimer);}, {once: true});
  audio.addEventListener('ended', () => {
    if (activeAudio === audio) activeAudio = null;
  }, {once: true});
  audioTimer = setTimeout(fallback, 4000);
  audio.src = url;
  audio.play().catch(fallback);
}

function speakTrack(text, suffix) {
  const key = 'e' + (S.current + 1) + '_' + suffix;
  const track = audioManifest[key];
  const valid = track?.text === text && /^e\d+_(?:s\d+|full)\.[a-f0-9]{12}\.mp3$/.test(track.file);
  speakText(text, valid ? './audio/' + track.file : null);
}

function toggleZh(){S.hideZh=!S.hideZh;render()} function vocab(){return readLocal('essay_vocab',[])} function addVocab(key,word,ctx,meaning){let v=vocab();if(!v.some(x=>x.key===key))v.unshift({key,word,ctx,meaning});writeLocal('essay_vocab',v);$('#addVocab').textContent='已加入生词本'}
function renderVocab(){let v=vocab();return `<div class="vocabList">${v.length?v.map((x,i)=>`<div class="vrow"><b>${esc(x.word)}</b><span>${esc(x.meaning)}</span><button class="btn" onclick="removeVocab(${i})">移除</button></div>`).join(''):'还没有生词。背诵时点击单词即可添加。'}</div>`}function removeVocab(i){let v=vocab();v.splice(i,1);writeLocal('essay_vocab',v);render()}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/)}function checkWriting(){let a=norm(fullText(S.essays[S.current])),b=norm($('#writing').value),hit=b.filter((x,i)=>x===a[i]).length,score=Math.round(hit/Math.max(a.length,1)*100);$('#score').style.display='block';$('#score').innerHTML=`顺序匹配度：<b>${score}%</b>。建议对照参考答案检查拼写和漏句。`}function toggleAnswer(){$('#answer').classList.toggle('show')}function clearWriting(){$('#writing').value='';writeLocal(draftKey(),'');$('#score').style.display='none'}
function done(){return readLocal('essay_done',[])}function markDone(){let d=done(),i=S.current;if(d.includes(i))d=d.filter(x=>x!==i);else d.push(i);writeLocal('essay_done',d);updateProgress()}function updateProgress(){let p=Math.round(done().length/Math.max(S.essays.length,1)*100);$('#pbar').style.width=p+'%';const doneButton=$('#done-toggle');if(doneButton){const mastered=done().includes(S.current);doneButton.textContent=mastered?'已掌握 · 取消':'标记已掌握';doneButton.setAttribute('aria-pressed',String(mastered))}$('#ptxt').textContent=`学习进度 ${p}%`}
fetch('audio/manifest.json').then(response => response.ok ? response.json() : {}).then(manifest => {audioManifest = manifest || {};}).catch(() => {});
$('#search').oninput=e=>renderList(e.target.value);fetch('source.txt').then(r=>{if(!r.ok)throw new Error('source.txt');return r.text()}).then(t=>{S.essays=parse(t);renderList();render()}).catch(()=>$('#main').innerHTML='<div class="empty">作文内容加载失败，请刷新页面。</div>');
</script></body></html>
