<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十篇英语小作文背诵助手</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script>

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"Noto Sans SC"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200 selection:bg-indigo-200 dark:selection:bg-indigo-800">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Word Dictionary Modal / Popover -->
  <div id="word-modal-backdrop" onclick="closeWordModal()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div id="word-modal-card" onclick="event.stopPropagation()" class="w-full sm:max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl p-5 sm:p-6 transform transition-all">
      <!-- Populated dynamically by JS -->
    </div>
  </div>

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebar-backdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-30 hidden lg:hidden transition-opacity"></div>

  <!-- Main App Layout -->

    <!-- Left Sidebar (Essay List) -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out shrink-0">
      <!-- Sidebar Header -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm font-bold text-lg">
            文
          </div>
          <div>
            <h1 class="font-bold text-sm text-slate-900 dark:text-white leading-tight">英语小作文背诵</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">精选 10 篇经典范文</p>
          </div>
        </div>
        <button onclick="toggleMobileSidebar(false)" class="lg:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="关闭目录">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Overall Progress Bar -->
      <div class="px-4 py-3 bg-slate-50/70 dark:bg-slate-800/40 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center justify-between text-xs mb-1.5">
          <span class="font-medium text-slate-600 dark:text-slate-300">背诵进度（本地保存）</span>
          <span id="overall-progress-text" class="font-semibold text-indigo-600 dark:text-indigo-400">0 / 10 篇已掌握</span>
        </div>
        <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="overall-progress-bar" class="h-full bg-indigo-600 dark:bg-indigo-500 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Essay Navigation List -->
      <nav id="essay-list" class="flex-1 overflow-y-auto p-3 space-y-1.5">
        <!-- Populated dynamically by JS -->
      </nav>

      <!-- Sidebar Footer -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
        <button onclick="toggleDarkMode()" class="flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
          <span id="theme-icon">🌙</span>
          <span id="theme-label">深色模式</span>
        </button>
      </div>
    </aside>

    <!-- Right Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0">

      <!-- Top Header Bar -->

        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 -ml-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700" aria-label="打开目录">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span id="header-badge" class="px-2 py-0.5 text-xs font-semibold rounded-md bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 shrink-0">第 1 篇</span>
                <h2 id="header-title" class="text-base sm:text-lg font-bold text-slate-900 dark:text-white truncate">建议信</h2>
              </div>
              <p id="header-subtitle" class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">P.48 经典范文004</p>
            </div>
          </div>

          <!-- Header Actions -->
          <div class="flex items-center gap-2">
            <!-- TTS Full Play Button -->
            <button id="btn-play-all" onclick="togglePlayAll()" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
              <span id="play-all-icon">🔊</span>
              <span id="play-all-text" class="hidden sm:inline">美音全文</span>
            </button>

            <!-- Voice Preference Selector -->
            <button id="btn-voice" onclick="cycleVoice()" title="切换备用朗读偏好（有本地MP3时优先播MP3）" class="inline-flex items-center gap-1 px-2.5 py-2 rounded-xl text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/70 dark:border-indigo-800/70 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors">
              <span>🎙️</span>
              <span id="voice-label">自然美音</span>
            </button>

            <!-- Speed Toggle -->
            <button id="btn-speed" onclick="cycleSpeechRate()" title="切换语速" class="px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
              1.0x
            </button>

            <!-- Mastered Toggle -->
            <button id="btn-master-essay" onclick="toggleEssayMastered()" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium border transition-colors">
              <span id="master-icon">○</span>
              <span id="master-text">标记掌握</span>
            </button>
          </div>
        </div>

        <!-- Mode Switcher Tabs -->
        <div class="mt-3 flex items-center gap-1.5 overflow-x-auto pb-0.5">
          <button onclick="switchMode('sentences')" data-mode="sentences" class="mode-tab px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all shrink-0">
            📖 逐句精背
          </button>
          <button onclick="switchMode('cloze')" data-mode="cloze" class="mode-tab px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all shrink-0">
            🧩 挖空填空
          </button>
          <button onclick="switchMode('dictation')" data-mode="dictation" class="mode-tab px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all shrink-0">
            ✍️ 全文默写
          </button>
          <button onclick="switchMode('fulltext')" data-mode="fulltext" class="mode-tab px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all shrink-0">
            📄 通读范文
          </button>
        </div>
      </header>

      <!-- Workspace Body -->
      <div id="workspace" class="flex-1 p-4 sm:p-6 max-w-4xl w-full mx-auto">
        <!-- Rendered dynamically based on active mode & active essay -->
      </div>

      <!-- Bottom Prev/Next Navigation -->
      <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 sm:px-6 py-3 mt-auto">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">

            ← 上一篇
          </button>
          <span id="footer-counter" class="text-xs font-medium text-slate-500 dark:text-slate-400">1 / 10</span>
          <button id="btn-next-essay" onclick="navigateEssay(1)" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
            下一篇 →
          </button>
        </div>
      </footer>
    </main>
  </div>

    // =========================================================================
    // 2. APPLICATION STATE (WITH LOCALSTORAGE PERSISTENCE)
    // =========================================================================
    const STORAGE_KEY = 'essay_memorizer_state_v2';

    const state = {
      currentEssayId: 1,
      mode: 'sentences', // 'sentences' | 'cloze' | 'dictation' | 'fulltext'
      sentenceDisplayMode: 'both', // 'both' | 'hideEn' | 'firstLetter' | 'hideZh'
      revealedSentences: new Set(), // keys like "1-0"
      starredSentences: new Set(),  // keys like "1-2"
      masteredEssays: new Set(),    // essay ids
      clozeDifficulty: 0.35,        // 0.25 | 0.35 | 0.55
      clozeInputMode: 'click',      // 'click' | 'type'
      clozeSeed: 1,
      clozeRevealed: new Set(),
      clozeTyped: {},               // key -> user string
      clozeChecked: false,
      dictationDrafts: {},          // essayId -> text
      dictationResult: null,
      speechRate: 1.0,
      isPlayingAll: false,
      voicePref: 'natural',         // 'natural' | 'female' | 'male'
      playingKey: null,             // tracks currently playing audio key
      darkMode: false
    };

    const VOICE_PREFS = [
      { id: 'natural', label: '自然美音', desc: '优先本地 MP3 / 微软自然美音' },
      { id: 'female', label: '美音女声', desc: '备用朗读优先美音女声' },
      { id: 'male', label: '美音男声', desc: '备用朗读优先美音男声' }
    ];

    let currentAudioEl = null;
    let hasShownFallbackTip = false;

    const STOP_WORDS = new Set([
      'a','an','the','is','am','are','was','were','be','to','of','in','on','at','for','and','or','but','if','as','by','it','we','you','i','my','your','our','his','her','its','this','that','with','from'
    ]);

    function saveLocalState() {
      try {
        const payload = {
          currentEssayId: state.currentEssayId,
          starredSentences: Array.from(state.starredSentences),
          masteredEssays: Array.from(state.masteredEssays),
          dictationDrafts: state.dictationDrafts,
          speechRate: state.speechRate,
          voicePref: state.voicePref,
          darkMode: state.darkMode
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (err) {
        // Ignore storage quota or private-mode errors
      }
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (typeof data.currentEssayId === 'number' && data.currentEssayId >= 1 && data.currentEssayId <= ESSAYS.length) {
          state.currentEssayId = data.currentEssayId;
        }
        if (Array.isArray(data.starredSentences)) {
          state.starredSentences = new Set(data.starredSentences);
        }
        if (Array.isArray(data.masteredEssays)) {
          state.masteredEssays = new Set(data.masteredEssays);
        }
        if (data.dictationDrafts && typeof data.dictationDrafts === 'object') {
          state.dictationDrafts = data.dictationDrafts;
        }
        if ([0.8, 1.0, 1.2].includes(data.speechRate)) {
          state.speechRate = data.speechRate;
        }
        if (VOICE_PREFS.some(v => v.id === data.voicePref)) {
          state.voicePref = data.voicePref;
        }
        if (typeof data.darkMode === 'boolean') {
          state.darkMode = data.darkMode;
        }
      } catch (err) {
        // Ignore malformed local data
      }
    }

    // =========================================================================
    // 3. UTILITY FUNCTIONS
    // =========================================================================
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getCurrentEssay() {
      return ESSAYS.find(e => e.id === state.currentEssayId) || ESSAYS[0];
    }

    function getFullText(essay, lang = 'en') {
      const header = essay.headerLines.map(l => l[lang]).join('\n');
      const paraMap = new Map();
      essay.sentences.forEach(s => {
        if (!paraMap.has(s.p)) paraMap.set(s.p, []);
        paraMap.get(s.p).push(s[lang]);
      });
      const body = Array.from(paraMap.values())
        .map(list => list.join(lang === 'en' ? ' ' : ''))
        .join('\n\n');
      const footer = essay.footerLines.map(l => l[lang]).join('\n');
      return `${header}\n\n${body}\n\n${footer}`;
    }

    function toFirstLetterHint(text) {
      return text.replace(/[A-Za-zÀ-ÿ]+/g, word => {
        if (word.length <= 2) return word;
        return word[0] + '_'.repeat(Math.min(word.length - 1, 6));
      });
    }

    function seededRandom(seed) {
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colorClass = type === 'success'
        ? 'bg-emerald-600 text-white'
        : type === 'error'
          ? 'bg-rose-600 text-white'
          : 'bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900';
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium shadow-lg ${colorClass} transition-all duration-300 opacity-0 translate-y-2`;
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    async function copyText(text, successMsg = '已复制到剪贴板') {
      try {
        await navigator.clipboard.writeText(text);
        showToast(successMsg, 'success');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(successMsg, 'success');
        } catch (e) {
          showToast('复制失败，请手动选中复制', 'error');
        }
        ta.remove();
      }
    }

    // =========================================================================
    // 4. FAST PROXY-FREE AMERICAN ENGLISH AUDIO (LOCAL MP3 + YOUDAO + NATURAL TTS)
    // =========================================================================
    function stopSpeech() {
      if (currentAudioEl) {
        currentAudioEl.pause();
        currentAudioEl.currentTime = 0;
        currentAudioEl = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      state.isPlayingAll = false;
      state.playingKey = null;
      updatePlayAllButton();
      updateSentenceAudioIcons();
    }

    // Pick the best natural American English voice available in the browser
    function pickBestUSVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const usVoices = voices.filter(v => /en[-_]US/i.test(v.lang));
      const pool = usVoices.length ? usVoices : voices.filter(v => /^en/i.test(v.lang));
      if (!pool.length) return null;

      if (state.voicePref === 'male') {
        return pool.find(v => /Andrew|Guy|Brian|Christopher|Eric|Steffan|David|Alex/i.test(v.name) && /Natural|Online/i.test(v.name))
          || pool.find(v => /Andrew|Guy|Brian|David|Alex|Daniel/i.test(v.name))
          || pool[0];
      }
      if (state.voicePref === 'female') {
        return pool.find(v => /Ava|Jenny|Aria|Emma|Michelle|Samantha/i.test(v.name) && /Natural|Online/i.test(v.name))
          || pool.find(v => /Ava|Jenny|Aria|Samantha|Google US English/i.test(v.name))
          || pool[0];
      }
      // Default: prioritize Microsoft Edge Neural Online voices, then Google/Apple natural US voices
      return pool.find(v => /Microsoft (Ava|Andrew|Jenny|Aria|Brian|Emma).*Natural/i.test(v.name))
        || pool.find(v => /Natural|Online/i.test(v.name))
        || pool.find(v => /Google US English|Samantha|Alex/i.test(v.name))
        || pool[0];
    }

    // Fallback browser TTS (works without proxy; Edge browser provides neural natural voices)
    function speakWithBrowserTTS(text, key = 'sent', onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        showToast('当前浏览器不支持语音朗读功能', 'error');
        stopSpeech();
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = state.speechRate;
      const preferred = pickBestUSVoice();
      if (preferred) utterance.voice = preferred;

      state.playingKey = key;
      if (key === 'all') state.isPlayingAll = true;
      updatePlayAllButton();
      updateSentenceAudioIcons();

      utterance.onend = () => {
        if (state.playingKey === key) state.playingKey = null;
        if (key === 'all') state.isPlayingAll = false;
        updatePlayAllButton();
        updateSentenceAudioIcons();
        if (onEndCallback) onEndCallback();
      };
      utterance.onerror = () => {
        if (state.playingKey === key) state.playingKey = null;
        if (key === 'all') state.isPlayingAll = false;
        updatePlayAllButton();
        updateSentenceAudioIcons();
        if (onEndCallback) onEndCallback();
      };
      window.speechSynthesis.speak(utterance);
    }

    // Play pre-generated static MP3 in ./audio/ first; automatically fall back to browser natural US voice
    function playEssayAudio(mp3Path, fallbackText, key) {
      stopSpeech();
      const audio = new Audio(mp3Path);
      audio.playbackRate = state.speechRate;
      currentAudioEl = audio;
      state.playingKey = key;
      if (key === 'all') state.isPlayingAll = true;
      updatePlayAllButton();
      updateSentenceAudioIcons();

      let fellBack = false;
      const triggerFallback = () => {
        if (fellBack) return;
        fellBack = true;
        if (currentAudioEl === audio) currentAudioEl = null;
        if (!hasShownFallbackTip) {
          hasShownFallbackTip = true;
          showToast('未检测到本地 MP3，已自动使用自然美音朗读（推荐用 Edge 或运行脚本生成 MP3）', 'info');
        }
        speakWithBrowserTTS(fallbackText, key);
      };

      audio.onended = () => {
        if (currentAudioEl === audio) currentAudioEl = null;
        if (state.playingKey === key) state.playingKey = null;
        if (key === 'all') state.isPlayingAll = false;
        updatePlayAllButton();
        updateSentenceAudioIcons();
      };

      audio.onerror = triggerFallback;
      audio.play().catch(triggerFallback);
    }

    // Play standard American English word pronunciation via Youdao (fast & proxy-free in China)
    function playWordAudio(word) {
      stopSpeech();
      const clean = word.trim();
      const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(clean)}&type=2`;
      const audio = new Audio(url);
      audio.playbackRate = Math.min(Math.max(state.speechRate, 0.8), 1.2);
      currentAudioEl = audio;
      state.playingKey = 'word';

      let fellBack = false;
      const fallback = () => {
        if (fellBack) return;
        fellBack = true;
        if (currentAudioEl === audio) currentAudioEl = null;
        speakWithBrowserTTS(clean, 'word');
      };

      audio.onended = () => {
        if (currentAudioEl === audio) currentAudioEl = null;
        state.playingKey = null;
      };
      audio.onerror = fallback;
      audio.play().catch(fallback);
    }

    function togglePlayAll() {
      if (state.isPlayingAll) {
        stopSpeech();
        return;
      }
      const essay = getCurrentEssay();
      const fullEn = getFullText(essay, 'en');
      playEssayAudio(`./audio/e${essay.id}_full.mp3`, fullEn, 'all');
    }

    function updatePlayAllButton() {
      const icon = document.getElementById('play-all-icon');
      const text = document.getElementById('play-all-text');
      const btn = document.getElementById('btn-play-all');
      if (!btn) return;
      if (state.isPlayingAll) {
        icon.textContent = '⏹️';
        text.textContent = '停止朗读';
        btn.classList.add('ring-2', 'ring-indigo-500');
      } else {
        icon.textContent = '🔊';
        text.textContent = '美音全文';

    function updateSentenceAudioIcons() {
      document.querySelectorAll('[data-sent-audio]').forEach(btn => {
        const key = btn.dataset.sentAudio;
        btn.textContent = state.playingKey === key ? '⏹️' : '🔊';
      });
    }

    function cycleVoice() {
      stopSpeech();
      const idx = VOICE_PREFS.findIndex(v => v.id === state.voicePref);
      const next = VOICE_PREFS[(idx + 1) % VOICE_PREFS.length];
      state.voicePref = next.id;
      document.getElementById('voice-label').textContent = next.label;
      saveLocalState();
      showToast(`已切换：${next.label}（${next.desc}）`);
    }

    function cycleSpeechRate() {
      const rates = [0.8, 1.0, 1.2];
      const nextIdx = (rates.indexOf(state.speechRate) + 1) % rates.length;
      state.speechRate = rates[nextIdx];
      document.getElementById('btn-speed').textContent = state.speechRate.toFixed(1) + 'x';
      if (currentAudioEl) {
        currentAudioEl.playbackRate = state.speechRate;
      }
      saveLocalState();
      showToast(`朗读语速已设为 ${state.speechRate.toFixed(1)}x`);
    }

    // Smart offline lookup with basic inflectional normalization
    function findInOfflineDict(rawWord) {
      const clean = rawWord.trim().toLowerCase()
        .replace(/[’']/g, "'")
        .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // résumé -> resume

      const candidates = [clean];
      if (clean.endsWith("'s")) candidates.push(clean.slice(0, -2));
      if (clean.endsWith('ies') && clean.length > 4) candidates.push(clean.slice(0, -3) + 'y');
      if (clean.endsWith('ied') && clean.length > 4) candidates.push(clean.slice(0, -3) + 'y');
      if (clean.endsWith('es') && clean.length > 3) candidates.push(clean.slice(0, -2));
      if (clean.endsWith('s') && clean.length > 2) candidates.push(clean.slice(0, -1));
      if (clean.endsWith('ing') && clean.length > 4) {
        candidates.push(clean.slice(0, -3));
        candidates.push(clean.slice(0, -3) + 'e');
        if (clean.length > 5 && clean[clean.length - 4] === clean[clean.length - 5]) {
          candidates.push(clean.slice(0, -4)); // planning -> plan, referring -> refer
        }
      }
      if (clean.endsWith('ed') && clean.length > 3) {
        candidates.push(clean.slice(0, -2));
        candidates.push(clean.slice(0, -1));
        if (clean.length > 4 && clean[clean.length - 3] === clean[clean.length - 4]) {
          candidates.push(clean.slice(0, -3)); // submitted -> submit
        }
      }

      for (const c of candidates) {
        if (OFFLINE_DICT[c]) {
          const [phonetic, pos, meaning, collocation, tip] = OFFLINE_DICT[c];
          return { word: rawWord, base: c, phonetic, pos, meaning, collocation, tip };
        }
      }
      return null;
    }

    function renderInteractiveEnglish(text, sentenceIndex) {
      const tokens = text.split(/([A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*)/);
      return tokens.map(token => {
        if (/^[A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*$/.test(token)) {
          const safeWord = token.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          return `<span onclick="lookupWord('${safeWord}', ${sentenceIndex}, event)" title="点击秒查：${escapeHtml(token)}" class="cursor-pointer rounded px-0.5 -mx-0.5 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors">${escapeHtml(token)}</span>`;
        }
        return escapeHtml(token);
      }).join('');
    }

    function lookupWord(word, sentenceIdx, event) {
      if (event) event.stopPropagation();
      const cleanWord = word.trim();
      const entry = findInOfflineDict(cleanWord);
      if (entry) {
        openWordModal(entry);
      } else {
        openWordModal({
          word: cleanWord,
          phonetic: '',
          pos: '基础词',
          meaning: '该词为基础常用词或专有名词，可直接对照本句参考译文理解。',
          collocation: '',
          tip: '点击右上角「🔊 美音」可立即收听有道真人美式发音。'
        });
      }
    }

      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      state.dictationResult = null;
      saveLocalState();
      toggleMobileSidebar(false);
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const nextId = state.currentEssayId + delta;
      if (nextId >= 1 && nextId <= ESSAYS.length) {
        selectEssay(nextId);

      stopSpeech();
      state.mode = newMode;
      renderAll();

    // =========================================================================

    function setClozeDifficulty(val) {
      state.clozeDifficulty = val;
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      renderWorkspace();

    function setClozeInputMode(mode) {
      state.clozeInputMode = mode;

      renderWorkspace();

    function reshuffleCloze() {
      state.clozeSeed += 1;
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      renderWorkspace();
      showToast('已重新随机生成挖空题目');

    function toggleClozeBlank(blankKey) {
      if (state.clozeRevealed.has(blankKey)) {
        state.clozeRevealed.delete(blankKey);
      } else {
        state.clozeRevealed.add(blankKey);
      }
      renderWorkspace();
    }

    function revealAllCloze() {
      document.querySelectorAll('[data-cloze-key]').forEach(el => {
        state.clozeRevealed.add(el.dataset.clozeKey);
      });
      renderWorkspace();
    }

    function hideAllCloze() {
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      renderWorkspace();
    }

    function handleClozeTyping(key, value) {
      state.clozeTyped[key] = value;
    }

    function checkClozeTyping() {
      state.clozeChecked = true;
      renderWorkspace();

    function buildClozeView(essay) {
      const diffs = [
        { val: 0.25, label: '简单 (25%)' },
        { val: 0.35, label: '标准 (35%)' },
        { val: 0.55, label: '挑战 (55%)' }
      ];

      let seed = essay.id * 1000 + state.clozeSeed * 37;
      let totalBlanks = 0;
      let correctTyped = 0;

      // Group sentences by paragraph
      const paraMap = new Map();
      essay.sentences.forEach((s, idx) => {
        if (!paraMap.has(s.p)) paraMap.set(s.p, []);
        paraMap.get(s.p).push({ ...s, idx });
      });

      const paragraphsHtml = Array.from(paraMap.entries()).map(([pNum, sList]) => {
        const renderedSentences = sList.map(s => {
          // Tokenize preserving punctuation and spaces
          const tokens = s.en.split(/([A-Za-zÀ-ÿ'-]+)/);
          return tokens.map((token, tIdx) => {
            if (!/^[A-Za-zÀ-ÿ'-]+$/.test(token)) return escapeHtml(token);
            const cleanLower = token.toLowerCase();
            const isCandidate = token.length >= 4 && !STOP_WORDS.has(cleanLower);
            const shouldBlank = isCandidate && seededRandom(seed++) < state.clozeDifficulty;

            if (!shouldBlank) return escapeHtml(token);

            totalBlanks++;
            const bKey = `${essay.id}-${s.idx}-${tIdx}`;

            if (state.clozeInputMode === 'click') {
              const isRev = state.clozeRevealed.has(bKey);
              return `<button type="button" data-cloze-key="${bKey}" onclick="toggleClozeBlank('${bKey}')" class="inline-block mx-0.5 px-2 py-0.5 rounded-lg font-semibold align-baseline transition-all border ${
                isRev
                  ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700'
                  : 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 dark:hover:bg-indigo-900/60'
              }">${isRev ? escapeHtml(token) : `${escapeHtml(token[0])}${'_'.repeat(Math.min(token.length - 1, 5))}`}</button>`;
            } else {
              const userVal = state.clozeTyped[bKey] || '';
              const isCorrect = userVal.trim().toLowerCase() === token.toLowerCase();
              if (state.clozeChecked && isCorrect) correctTyped++;
              const widthCh = Math.max(token.length + 2, 6);
              let inputBorder = 'border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white';
              if (state.clozeChecked) {
                inputBorder = isCorrect
                  ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300'
                  : 'border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300';
              }
              const correctionBadge = (state.clozeChecked && !isCorrect)
                ? `<span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 ml-1">(${escapeHtml(token)})</span>`
                : '';
              return `<span class="inline-flex items-baseline mx-0.5"><input type="text" data-cloze-key="${bKey}" value="${escapeHtml(userVal)}" oninput="handleClozeTyping('${bKey}', this.value)" placeholder="${escapeHtml(token[0])}..." style="width:${widthCh}ch" class="px-1.5 py-0.5 text-sm sm:text-base rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors ${inputBorder}" />${correctionBadge}</span>`;
            }
          }).join('');
        }).join(' ');

        const zhPara = sList.map(s => s.zh).join('');
        return `
          <div class="mb-5 last:mb-0">
            <p class="text-base sm:text-[17px] leading-[2.1] text-slate-800 dark:text-slate-100">${renderedSentences}</p>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2 pl-3 border-l-2 border-slate-200 dark:border-slate-700">${escapeHtml(zhPara)}</p>
          </div>
        `;
      }).join('');

      const scoreBanner = (state.clozeInputMode === 'type' && state.clozeChecked)
        ? `<div class="mb-4 p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800 flex items-center justify-between">
            <span class="text-sm font-semibold text-indigo-800 dark:text-indigo-200">批改结果：答对 ${correctTyped} / ${totalBlanks} 空（正确率 ${totalBlanks ? Math.round((correctTyped / totalBlanks) * 100) : 0}%）</span>
            <button onclick="hideAllCloze()" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline">清空重填</button>
          </div>`
        : '';

      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 border border-slate-200 dark:border-slate-800 shadow-xs mb-5 flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-1.5">

            <span class="mx-1 text-slate-300 dark:text-slate-700">|</span>
            <button onclick="setClozeInputMode('click')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${state.clozeInputMode === 'click' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">点击显隐</button>
            <button onclick="setClozeInputMode('type')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${state.clozeInputMode === 'type' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">拼写填空</button>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="reshuffleCloze()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700">🔀 换一批空</button>
            ${state.clozeInputMode === 'click'
              ? `<button onclick="revealAllCloze()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-emerald-600 text-white hover:bg-emerald-700">全部显示</button>
                 <button onclick="hideAllCloze()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700">全部隐藏</button>`
              : `<button onclick="checkClozeTyping()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700">✓ 检查拼写</button>`
            }
          </div>
        </div>

        ${scoreBanner}

        <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-xs">
          <div class="mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 space-y-1">
            ${essay.headerLines.map(l => `<div class="font-semibold text-slate-900 dark:text-slate-100">${escapeHtml(l.en)}</div>`).join('')}
          </div>
          ${paragraphsHtml}
          <div class="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-1">
            ${essay.footerLines.map(l => `<div class="font-semibold text-slate-900 dark:text-slate-100">${escapeHtml(l.en)}</div>`).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. MODE 3: FULL DICTATION & WORD-LEVEL DIFF CHECKER
    // =========================================================================
    function handleDictationInput(val) {
      state.dictationDrafts[state.currentEssayId] = val;

    function clearDictation() {
      state.dictationDrafts[state.currentEssayId] = '';
      state.dictationResult = null;
      saveLocalState();
      renderWorkspace();
    }

    // Longest Common Subsequence (LCS) word-level diff
    function computeWordDiff(expectedText, userText) {
      const normalize = w => w.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, '');
      const expWords = expectedText.trim().split(/\s+/).filter(Boolean);
      const usrWords = userText.trim().split(/\s+/).filter(Boolean);

      const m = expWords.length;
      const n = usrWords.length;
      const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (normalize(expWords[i - 1]) === normalize(usrWords[j - 1])) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }

      const diff = [];
      let i = m, j = n;
      let matchedCount = 0;

      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && normalize(expWords[i - 1]) === normalize(usrWords[j - 1])) {
          diff.push({ type: 'same', text: expWords[i - 1] });
          matchedCount++;
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          diff.push({ type: 'extra', text: usrWords[j - 1] });
          j--;
        } else {
          diff.push({ type: 'missing', text: expWords[i - 1] });
          i--;
        }
      }

      diff.reverse();
      const accuracy = m > 0 ? Math.round((matchedCount / m) * 100) : 0;
      return { diff, accuracy, matchedCount, totalExpected: m };
    }

    function gradeDictation() {
      const essay = getCurrentEssay();
      const userText = (state.dictationDrafts[essay.id] || '').trim();
      if (!userText) {
        showToast('请先在下方默写框中输入英文内容', 'error');
        return;
      }
      const expectedText = getFullText(essay, 'en');
      state.dictationResult = computeWordDiff(expectedText, userText);
      renderWorkspace();
      showToast(`批改完成！匹配准确率为 ${state.dictationResult.accuracy}%`, state.dictationResult.accuracy >= 85 ? 'success' : 'info');
    }

    function buildDictationView(essay) {
      const fullZh = getFullText(essay, 'zh');

      if (state.dictationResult) {

          } else {

          }

        resultHtml = `

      }

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs flex flex-col">

            <div class="text-sm sm:text-[15px] leading-relaxed text-slate-700 dark:text-slate-300 whitespace-pre-line flex-1">
              ${escapeHtml(fullZh)}

          <!-- English Dictation Input Card -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs flex flex-col">

            <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">完整中文参考译文</h3>
                <p class="text-xs text-slate-500">对照理解行文逻辑</p>
              </div>
              <button onclick="copyEssayText('zh')" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
                📋 复制中文
              </button>
            </div>
            <div class="text-sm sm:text-[15px] leading-relaxed text-slate-600 dark:text-slate-300 whitespace-pre-line">
              ${escapeHtml(fullZh)}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. INITIALIZE APPLICATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      // Apply persisted theme, speed, and voice preference
      document.documentElement.classList.toggle('dark', state.darkMode);
      document.getElementById('theme-icon').textContent = state.darkMode ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = state.darkMode ? '浅色模式' : '深色模式';
      document.getElementById('btn-speed').textContent = state.speechRate.toFixed(1) + 'x';
      const activeVoice = VOICE_PREFS.find(v => v.id === state.voicePref) || VOICE_PREFS[0];
      document.getElementById('voice-label').textContent = activeVoice.label;

      // Pre-load voices for Web Speech API
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      renderAll();
    });
  </script>
</body>
</html>
