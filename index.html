  <style>

    .tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);overflow:auto;margin-bottom:18px}.tab{border:0;background:transparent;padding:11px 14px;color:var(--muted);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
    .sentence{position:relative;padding:15px 42px 15px 0;border-bottom:1px dashed var(--line);overflow:visible}.sentence>.btn{position:absolute;right:0;top:14px;width:32px;height:32px;font-size:16px;padding:0;border-radius:50%;color:#486581;display:grid;place-items:center}.en{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.8;color:#172b4d;white-space:normal;overflow-wrap:anywhere;word-break:normal;max-width:100%}.zh{color:#486581;margin-top:6px;white-space:normal;overflow-wrap:anywhere}.word{display:inline;border-radius:5px;padding:1px 0;cursor:pointer}.word:hover{background:#fff3bf;color:#8a4b00}.hidezh .zh{display:none}

    .reciteRow{padding:15px 0;border-bottom:1px dashed var(--line)}.reciteZh{font-size:18px;color:#243b53}.reciteAnswer{display:none;margin-top:9px;padding:10px 12px;background:#edf4ff;border-radius:10px;font-family:Georgia,"Times New Roman",serif;font-size:18px;color:#174ea6}.reciteAnswer.show{display:block}.reciteRow .btn{font-size:13px;padding:4px 9px;margin-top:8px}
    .dict{position:fixed;inset:auto 14px 14px auto;z-index:50;width:min(380px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 70px rgba(16,42,67,.24);padding:17px;display:none}.dict.show{display:block}.dicthead{display:flex;align-items:center;gap:10px}.dictword{font:700 24px Georgia,serif}.phon{color:var(--muted)}.close{margin-left:auto;border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px;cursor:pointer}.meaning{margin:12px 0}.context{padding:10px 12px;background:#f4f8fb;border-radius:10px;color:#486581;font-size:14px}.vocab{margin-top:10px}
    textarea{width:100%;min-height:270px;border:1px solid var(--line);border-radius:14px;padding:15px;resize:vertical;outline:none}.score{margin-top:12px;padding:12px;border-radius:12px;background:#f1f5f9}.answer{white-space:pre-wrap;font-family:Georgia,serif;font-size:18px;line-height:1.75;padding:18px;background:#f8fafc;border-radius:14px;display:none}.answer.show{display:block}.vocabList{display:grid;gap:9px}.vrow{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px}.vrow b{min-width:110px}.vrow button{margin-left:auto}

    @media(max-width:760px){.topin{padding:10px 14px}.progress{min-width:95px}.brand small{display:none}.layout{display:block;padding:12px}.side{position:relative;top:0;height:230px;margin-bottom:12px}.main{padding:17px}h1{font-size:23px}.toolbar{gap:7px}.btn{padding:8px 10px}.en{font-size:18px}.dict{bottom:10px;left:10px;right:10px;width:auto}}

<body>
<div class="app"><header class="top"><div class="topin"><div class="brand">考研英语作文背诵助手<small>逐句理解 · 听读 · 挖空 · 默写</small></div><div class="progress"><div class="bar"><i id="pbar"></i></div><div class="ptxt" id="ptxt">学习进度 0%</div></div></div></header>
<div class="layout"><aside class="panel side"><div class="search"><input id="search" placeholder="搜索作文类型或内容"></div><div class="list" id="list"></div></aside><main class="panel main" id="main"><div class="loading">正在整理作文内容…</div></main></div></div>
<div class="dict" id="dict"><div class="dicthead"><div class="dictword" id="dictword"></div><div class="phon" id="phon"></div><button class="close" onclick="closeDict()">×</button></div><div class="meaning" id="meaning">正在查询中文释义…</div><div class="context" id="context"></div><div class="vocab"><button class="btn primary" id="addVocab">加入生词本</button> <button class="btn" id="speakWord">听发音</button></div></div>
<script>
const S={essays:[],current:0,tab:'study',hideZh:false,rate:.9,speaking:false};
const $=s=>document.querySelector(s), esc=s=>(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const LOCAL_ZH=Object.fromEntries(`behalf|代表\nunion|联合会；学生会\nextend|表达；给予\nheartfelt|衷心的\noverseas|海外的；留学生的\npractical|实用的\nsuggestion|建议\nprestigious|有声望的；知名的\nperhaps|也许\nexpect|预期；期待\ntightly|紧紧地\nbound|受约束的\ndaily|每日的\nabundant|大量的；丰富的\nfrequent|频繁的\nprepared|准备好的\nhectic|繁忙的\nspite|尽管\nburden|负担\nextracurricular|课外的\nspeech|演讲\ncontest|比赛\ngathering|聚会\nample|充足的\nopportunity|机会\nesteemed|受尊敬的；著名的\npressure|压力\nworthwhile|值得的；有意义的\nenhance|提升；增添\nkeen|热衷的\nancient|古代的\nnovel|小说\nromance|传奇；演义\nkingdom|王国\nplanning|计划\ndirect|执导；直接的\nrevised|改编的；修订的\nclassical|古典的\ndepict|描写\npolitical|政治的\nmilitary|军事的\nstruggle|斗争\nreveal|揭示\nturbulent|动荡的\nportray|塑造；描绘\nimage|形象\ncharacter|人物；角色\nexcel|擅长\nacting|表演\ncordially|诚挚地\ninvite|邀请\nparticipate|参加\nleading|主要的；主演的\nhero|主人公；英雄\nreply|回复\nrecommend|推荐；介绍\ncelebrity|名人\nthinker|思想家\neducator|教育家\nfounder|创始人\nconfucianism|儒家思想\nsage|圣人；贤者\nspring|春季；春秋时期的春\nautumn|秋季；春秋时期的秋\nrecorded|记录的\ndisciple|弟子\nanalects|论语\nenduring|持久的；不朽的\nculture|文化\ninfluence|影响\npolitician|政治家\nconfucian|儒家的\nremain|仍然；保持\nregular|经常的；常客\npassenger|乘客\ndisappointed|失望的\nprovided|提供的\nrecently|最近\nsatisfactory|令人满意的\ntherefore|因此\ndraw|引起；吸引\nattention|关注\nissue|问题\nimprove|改进\npunctuality|准时\nessential|至关重要的\nrailway|铁路\ndelayed|延误的\nfrequently|频繁地\ninconvenience|不便\nattitude|态度\non-board|车上的\nstaff|工作人员\nembody|体现\nprinciple|原则\ncustomer|顾客\nconsideration|考虑\nmanagement|管理\nsystem|系统\nimprovement|改进\nprofessor|教授\nlanguage|语言\nexpert|专家\ninspire|启发；鼓舞\navailable|有空的；可用的\nallocate|分配\nsession|环节；会议\ngratitude|感激\nrefer|指的是；提及\nunfortunate|不幸的\naccident|事故\nknocked|撞倒的\ntaxi|出租车\ntimely|及时的\nassistance|帮助\nfirst aid|急救\nconsequence|后果\nquick-witted|机智的\nresponse|反应；回应\nemergency|紧急情况\noutcome|结果\nmounting|不断增加的\nunselfish|无私的\npractice|践行；练习\npreach|宣扬；说教\nattend|参加\ninterview|面试\nunfortunately|不幸地\ndiagnosed|被诊断的\ninfection|感染\nrequire|需要\nsurgery|手术\npostpone|推迟\napologize|道歉\nhearing|收到消息；听力\ncaused|造成的\nexcuse|原谅；借口\napply|申请；应用\nposition|职位；位置\nsuitable|合适的\ngraduate|毕业\nbachelor's|学士的\nenclosed|随信附上的\nresume|简历\nacademic|学业的；学术的\nexperience|经验\ncheerful|开朗的\npersonality|性格\nsuited|适合的\nnative|母语的；本地的\ntutor|辅导；导师\ngrant|给予；批准\nappreciate|感激\nnotice|通知\nserve|充当；服务\nplatform|平台\ndemonstrate|展示\noutstanding|杰出的\nability|能力\nrange|范围\ninvolve|包含；参与\nvariety|多样\nstaging|上演；组织\nmusical|音乐剧；音乐的\ndiscussion|讨论\noscar-winning|奥斯卡获奖的\ndebate|辩论\nbeneficial|有益的\nmultiple|多方面的；多个的\nparticipation|参与\nstrengthen|加强\nresponsibility|责任\ninterpersonal|人际的\nrelation|关系\norganized|有组织的\nproficiency|熟练程度\ncommand|掌握；命令\nedge|优势；边缘\npeer|同龄人\nsubmit|提交\napplication|申请\nmembership|会员资格\ndeadline|截止日期\nrecreation|娱乐\nmember|成员\npreside|主持\nattach|附上\nnoble|高尚的\nencourage|鼓励\nachieve|实现\ncontribute|贡献\nfinancial|经济的；财务的\nsenior|高年级的；年长的\nremote|偏远的\nprovince|省\nseek|寻找\nafford|负担得起\neducation|教育\ntuition|学费\nannual|每年的\nbasis|基础；方式\ngraduate|毕业\nremit|汇款\ndonation|捐款\nbank account|银行账户\nlocal|当地的\ndiscover|发现\nerror|错误\nomission|遗漏\nsubmitted|已提交的\nmeeting|会议\nactivity|活动\nlecture|讲座\nquestion|问题\nanswer|回答\nproject|项目\nfriend|朋友\nstudent|学生\nuniversity|大学\ncollege|大学\ncampus|校园\nclass|课程\nhomework|作业\nexam|考试\nlife|生活\nwelcome|欢迎\npleasure|荣幸；愉快\nfirst|首先；第一\nsecond|其次；第二\nfinally|最后\nhowever|然而\nalthough|尽管\nbelieve|相信\nhope|希望\ninterest|兴趣\ncontact|联系\nservice|服务\nserious|严重的；认真的\npossible|可能的\npromise|保证；承诺\nreason|原因\nperfect|非常合适的；完美的\nhelp|帮助\nsummary|总结\nfamily|家庭\nplace|地点\narea|地区\nclub|社团\nroom|房间\ncenter|中心\nwriting|写作\nemail|电子邮件\nworld|世界\nhistory|历史\nstory|故事\nthought|思想\nfree|自由的；免费的\nfeel|感觉\ntrain|火车\nboard|车上；木板\nletter|信件\nmatter|事情\nreview|审查；回顾\nglad|高兴的\nshare|分享；共同拥有\nlove|热爱\nlearn|学习\nquestion-and-answer|问答\nexpress|表达\nquick|迅速的\ntoday|如今；今天\nneed|需要\napply|申请\njob|工作\ndaughter|女儿\nonline|在线的\nkid|孩子\nexperience|经历；经验\nteach|教授\njoin|加入\nwritten|书面的\noffice|办公室\nfollow|遵循；如下\nmoved|感动的\nagree|同意\npay|支付\ndirectly|直接地`.split('\n').map(x=>x.split('|')));
function isZh(s){return /[\u3400-\u9fff]/.test(s)} function isEnglish(s){return /[A-Za-z]{2}/.test(s)&&!isZh(s)}
function clean(s){return s.replace(/^\s*[①②③④⑤⑥⑦⑧⑨⑩]\s*/,'').trim()}
function parse(txt){
 const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean), out=[]; let cur=null,mode='';
 for(let i=0;i<lines.length;i++){let x=lines[i];
  if(/第[一二三四五六七八九十百0-9]+篇[:：]/.test(x)){if(cur)out.push(cur);cur={title:x.replace(/^第.+?篇[:：]\s*/,''),source:x,pairs:[],full:[]};mode='';continue}
  if(!cur)continue;if(x.includes('中英逐句对照版')){mode='pairs';continue} if(x.includes('完整纯英文版')){mode='full';continue} if(x.includes('完整中文版')){mode='done';continue}
  if(mode==='pairs'&&isEnglish(x)){let y=lines[i+1];if(y&&isZh(y)){cur.pairs.push({en:clean(x),zh:clean(y)});i++}}
  else if(mode==='full'&&isEnglish(x))cur.full.push(clean(x));
 }
 if(cur)out.push(cur); return out.filter(e=>e.pairs.length||e.full.length)
}
function fullText(e){return (e.full.length?e.full:e.pairs.map(p=>p.en)).join('\n\n')}
function wordsHtml(text,ctx){return esc(text).replace(/([A-Za-z]+(?:['’\-][A-Za-z]+)*)/g,w=>`<span class="word" data-word="${w}" data-context="${esc(ctx)}">${w}</span>`)}
function renderList(q=''){const list=S.essays.map((e,i)=>({e,i})).filter(o=>(o.e.title+' '+fullText(o.e)).toLowerCase().includes(q.toLowerCase()));$('#list').innerHTML=list.map(o=>`<button class="essay ${o.i===S.current?'active':''}" data-i="${o.i}"><b>${esc(o.e.title)}</b><span>${o.e.pairs.length} 个对照句</span></button>`).join('');document.querySelectorAll('.essay').forEach(b=>b.onclick=()=>{S.current=+b.dataset.i;S.tab='study';render()})}
function render(){renderList($('#search').value);const e=S.essays[S.current];if(!e)return;let content='';
 if(S.tab==='study')content=`<div class="${S.hideZh?'hidezh':''}">${e.pairs.map((p,i)=>`<div class="sentence"><div class="en">${wordsHtml(p.en,p.zh)}</div><div class="zh">${esc(p.zh)}</div><button class="btn sentenceSpeak" title="朗读本句" aria-label="朗读本句" data-sentence="${encodeURIComponent(p.en)}">🔊</button></div>`).join('')}</div>`;
 if(S.tab==='recite')content=`<div class="toolbar"><button class="btn" onclick="toggleAllRecite(true)">显示全部英文</button><button class="btn" onclick="toggleAllRecite(false)">隐藏全部英文</button></div>${e.pairs.map((p,i)=>`<div class="reciteRow"><div class="reciteZh">${esc(p.zh)}</div><button class="btn" onclick="document.getElementById('ra${i}').classList.toggle('show')">看答案</button><div class="reciteAnswer" id="ra${i}">${wordsHtml(p.en,p.zh)}</div></div>`).join('')}`;
 if(S.tab==='cloze')content=e.pairs.map((p,i)=>`<div class="sentence"><div class="en">${cloze(p.en,i)}</div><div class="zh">${esc(p.zh)}</div></div>`).join('')+`<p class="notice">点击横线可显示或隐藏单词。</p>`;
 if(S.tab==='dictation')content=`<textarea id="writing" placeholder="根据中文或记忆，在这里默写英文全文…"></textarea><div class="toolbar"><button class="btn green" onclick="checkWriting()">核对默写</button><button class="btn" onclick="toggleAnswer()">显示参考答案</button><button class="btn" onclick="clearWriting()">清空</button></div><div class="score" id="score" style="display:none"></div><div class="answer" id="answer">${esc(fullText(e))}</div>`;
 if(S.tab==='vocab')content=renderVocab();
 $('#main').innerHTML=`<h1>${esc(e.title)}</h1><div class="meta">${esc(e.source)} · 共 ${e.pairs.length} 个对照句</div><div class="toolbar"><button class="btn primary" onclick="speakText(fullText(S.essays[S.current]))">朗读全文</button><button class="btn" onclick="stopSpeak()">停止</button><select class="speed" onchange="S.rate=+this.value"><option value=".75">0.75×</option><option value=".9" selected>0.9×</option><option value="1">1.0×</option><option value="1.15">1.15×</option></select><button class="btn" onclick="toggleZh()">${S.hideZh?'显示翻译':'隐藏翻译'}</button><button class="btn green" onclick="markDone()">标记已掌握</button></div><div class="tabs">${[['study','逐句背诵'],['recite','全文背诵'],['cloze','关键词挖空'],['dictation','全文默写'],['vocab','生词本']].map(t=>`<button class="tab ${S.tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="content">${content}</div><p class="notice">提示：点击任意英文单词，可查看中文释义、音标并听发音。朗读为 AI 合成语音。</p>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});document.querySelectorAll('.sentenceSpeak').forEach(b=>b.onclick=()=>speakText(decodeURIComponent(b.dataset.sentence))); bindWords();updateProgress();
}
function cloze(text,seed){let n=0;return esc(text).replace(/([A-Za-z]+(?:['’\-][A-Za-z]+)*)/g,w=>{n++;let hide=w.length>5&&(n+seed)%3===0;return hide?`<span class="clozeWord" onclick="this.classList.toggle('reveal')">${w}</span>`:w})}
function toggleAllRecite(show){document.querySelectorAll('.reciteAnswer').forEach(x=>x.classList.toggle('show',show));bindWords()}
function bindWords(){document.querySelectorAll('.word').forEach(w=>w.onclick=()=>openDict(w.dataset.word,w.dataset.context))}
function wordCache(){return JSON.parse(localStorage.getItem('essay_word_cache')||'{}')}function saveWord(key,data){let c=wordCache();c[key]={...(c[key]||{}),...data};localStorage.setItem('essay_word_cache',JSON.stringify(c))}
function timedFetch(url,ms=3500){let c=new AbortController(),id=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).then(r=>r.json()).finally(()=>clearTimeout(id))}
async function openDict(word,ctx){let key=word.toLowerCase(),cached=wordCache()[key]||{},local=LOCAL_ZH[key];$('#dictword').textContent=word;$('#phon').textContent=cached.phon||'';$('#meaning').textContent=local||cached.zh||'基础词，可结合下方句子理解。';$('#context').textContent='所在句译文：'+ctx;$('#dict').classList.add('show');$('#speakWord').onclick=()=>speakText(word);$('#addVocab').onclick=()=>addVocab(key,word,ctx,$('#meaning').textContent);
 if(!cached.phon)timedFetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),2500).then(d=>{if(Array.isArray(d)){let x=d[0],phon=x.phonetic||x.phonetics?.find(p=>p.text)?.text||'';$('#phon').textContent=phon;saveWord(key,{phon})}}).catch(()=>{});
}
function closeDict(){$('#dict').classList.remove('show')} function speakText(text){if(!('speechSynthesis'in window)){alert('当前内置浏览器不支持网页朗读，请选择“在浏览器中打开”，使用 Chrome 访问。');return}let synth=window.speechSynthesis;synth.cancel();synth.resume();let run=()=>{let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=S.rate;u.volume=1;let vs=synth.getVoices(),v=vs.find(v=>v.lang.startsWith('en-US')&&/Samantha|Ava|Jenny|Aria|Female|Google US English/i.test(v.name))||vs.find(v=>v.lang.startsWith('en-US'))||vs.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onerror=()=>alert('当前页面无法调用语音，请用 Chrome 打开此网址后重试。');synth.speak(u)};setTimeout(run,80)}function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function toggleZh(){S.hideZh=!S.hideZh;render()} function vocab(){return JSON.parse(localStorage.getItem('essay_vocab')||'[]')} function addVocab(key,word,ctx,meaning){let v=vocab();if(!v.some(x=>x.key===key))v.unshift({key,word,ctx,meaning});localStorage.setItem('essay_vocab',JSON.stringify(v));$('#addVocab').textContent='已加入生词本'}
function renderVocab(){let v=vocab();return `<div class="vocabList">${v.length?v.map((x,i)=>`<div class="vrow"><b>${esc(x.word)}</b><span>${esc(x.meaning)}</span><button class="btn" onclick="removeVocab(${i})">移除</button></div>`).join(''):'还没有生词。背诵时点击单词即可添加。'}</div>`}function removeVocab(i){let v=vocab();v.splice(i,1);localStorage.setItem('essay_vocab',JSON.stringify(v));render()}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/)}function checkWriting(){let a=norm(fullText(S.essays[S.current])),b=norm($('#writing').value),hit=b.filter((x,i)=>x===a[i]).length,score=Math.round(hit/Math.max(a.length,1)*100);$('#score').style.display='block';$('#score').innerHTML=`顺序匹配度：<b>${score}%</b>。建议对照参考答案检查拼写和漏句。`}function toggleAnswer(){$('#answer').classList.toggle('show')}function clearWriting(){$('#writing').value='';$('#score').style.display='none'}
function done(){return JSON.parse(localStorage.getItem('essay_done')||'[]')}function markDone(){let d=done(),i=S.current;if(d.includes(i))d=d.filter(x=>x!==i);else d.push(i);localStorage.setItem('essay_done',JSON.stringify(d));updateProgress()}function updateProgress(){let p=Math.round(done().length/Math.max(S.essays.length,1)*100);$('#pbar').style.width=p+'%';$('#ptxt').textContent=`学习进度 ${p}%`}
$('#search').oninput=e=>renderList(e.target.value);fetch('source.txt').then(r=>r.text()).then(t=>{S.essays=parse(t);renderList();render()}).catch(()=>$('#main').innerHTML='<div class="empty">作文内容加载失败，请刷新页面。</div>');
</script></body></html>
