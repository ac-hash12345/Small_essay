    // =========================================================================

    const wordDictCache = new Map();

    const STOP_WORDS = new Set([
      'a','an','the','is','am','are','was','were','be','to','of','in','on','at','for','and','or','but','if','as','by','it','we','you','i','my','your','our','his','her','its','this','that','with','from'

    // =========================================================================
    // 3. UTILITY FUNCTIONS
    // =========================================================================
    function getCurrentEssay() {
      return ESSAYS.find(e => e.id === state.currentEssayId) || ESSAYS[0];

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getFullText(essay, lang = 'en') {
      const header = essay.headerLines.map(l => l[lang]).join('\n');
      const paraMap = new Map();
      essay.sentences.forEach(s => {
        if (!paraMap.has(s.p)) paraMap.set(s.p, []);
        paraMap.get(s.p).push(s[lang]);
      });
      const joiner = lang === 'en' ? ' ' : '';
      const body = Array.from(paraMap.values()).map(list => list.join(joiner)).join('\n\n');
      const footer = essay.footerLines.map(l => l[lang]).join('\n');
      return `${header}\n\n${body}\n\n${footer}`;
    }

    function toFirstLetterHint(text) {
      return text.replace(/[A-Za-zÀ-ÿ]+/g, word => {
        if (word.length <= 1) return word;
        return word[0] + '_'.repeat(Math.min(word.length - 1, 5));
      });

    function showToast(message, type = 'info') {

    function copyText(text, successMsg = '已复制到剪贴板') {

    // =========================================================================
    // 4. AI NATURAL AMERICAN ENGLISH TTS & DICTIONARY (Gemini API + Fallback)
    // =========================================================================
    const GEMINI_API_KEY = ""; // Runtime-provided

    // Exponential backoff fetch wrapper for Gemini API
    async function fetchGeminiWithRetry(url, payload, maxRetries = 4) {
      let delay = 1000;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            return await response.json();
          }
          if (response.status === 429 || response.status >= 500) {
            if (attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
          }
          throw new Error(`HTTP ${response.status}`);
        } catch (err) {
          if (attempt < maxRetries) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          throw err;
        }
      }
    }

    // Convert base64 string to ArrayBuffer
    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Wrap raw signed 16-bit PCM data in a standard WAV container
    function pcmToWav(pcm16, sampleRate = 24000, numChannels = 1) {
      const byteRate = sampleRate * numChannels * 2;
      const blockAlign = numChannels * 2;
      const dataSize = pcm16.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);           // Subchunk1Size (PCM)
      view.setUint16(20, 1, true);            // AudioFormat (1 = PCM)
      view.setUint16(22, numChannels, true);  // NumChannels
      view.setUint32(24, sampleRate, true);   // SampleRate
      view.setUint32(28, byteRate, true);     // ByteRate
      view.setUint16(32, blockAlign, true);   // BlockAlign
      view.setUint16(34, 16, true);           // BitsPerSample
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcm16.length; i++, offset += 2) {
        view.setInt16(offset, pcm16[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function stopSpeech() {
      if (currentAudioEl) {
        currentAudioEl.pause();
        currentAudioEl.currentTime = 0;
        currentAudioEl = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      state.isPlayingAll = false;
      state.ttsLoadingKey = null;
      state.playingKey = null;
      updatePlayAllButton();
      updateSentenceAudioIcons();
    }

    // Fallback to browser Web Speech API if AI TTS is unavailable
    function fallbackBrowserSpeak(text, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        showToast('当前浏览器不支持语音朗读功能', 'error');
        if (onEndCallback) onEndCallback();
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = state.speechRate;
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => /Google US English|Samantha|Aria|Jenny|Natural/i.test(v.name) && v.lang.startsWith('en-US'))
        || voices.find(v => v.lang.startsWith('en-US'))
        || voices.find(v => v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;
      utterance.onend = () => { if (onEndCallback) onEndCallback(); };
      utterance.onerror = () => { if (onEndCallback) onEndCallback(); };
      window.speechSynthesis.speak(utterance);
    }

    // Play expressive American English via Gemini TTS (with caching & fallback)
    async function speakWithAI(text, { key = 'sent', isWord = false, onEnd = null } = {}) {
      stopSpeech();
      const cacheKey = `${state.ttsVoice}::${isWord ? 'W' : 'S'}::${text}`;

      const playAudioUrl = (url) => {
        const audio = new Audio(url);
        audio.playbackRate = state.speechRate;
        currentAudioEl = audio;
        state.playingKey = key;
        if (key === 'all') state.isPlayingAll = true;
        updatePlayAllButton();
        updateSentenceAudioIcons();

        audio.onended = () => {
          currentAudioEl = null;
          state.playingKey = null;
          if (key === 'all') state.isPlayingAll = false;
          updatePlayAllButton();
          updateSentenceAudioIcons();
          if (onEnd) onEnd();
        };
        audio.onerror = () => {
          currentAudioEl = null;
          state.playingKey = null;
          if (key === 'all') state.isPlayingAll = false;
          updatePlayAllButton();
          updateSentenceAudioIcons();
        };
        audio.play().catch(() => {
          fallbackBrowserSpeak(text, onEnd);
        });
      };

      // Use cached audio immediately if available
      if (ttsAudioCache.has(cacheKey)) {
        playAudioUrl(ttsAudioCache.get(cacheKey));
        return;
      }

      // Show loading state while generating expressive American English audio
      state.ttsLoadingKey = key;
      updatePlayAllButton();
      updateSentenceAudioIcons();

      try {
        const stylePrompt = isWord
          ? `Pronounce the following English word clearly and naturally in standard American English: ${text}`
          : `Read the following English passage aloud in a natural, expressive standard American English accent—just like a native speaker in a modern American TV drama, with warm tone, authentic rising and falling intonation, natural phrasing, and subtle emotional emphasis:\n\n${text}`;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${GEMINI_API_KEY}`;
        const payload = {
          contents: [{ parts: [{ text: stylePrompt }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: state.ttsVoice }
              }
            }
          },
          model: "gemini-2.5-flash-preview-tts"
        };

        const result = await fetchGeminiWithRetry(apiUrl, payload);
        const part = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
        const audioData = part?.inlineData?.data;
        const mimeType = part?.inlineData?.mimeType || 'audio/L16;rate=24000';

        // If user cancelled or started another playback while loading, abort
        if (state.ttsLoadingKey !== key) return;
        state.ttsLoadingKey = null;

        if (audioData && mimeType.startsWith('audio/')) {
          const rateMatch = mimeType.match(/rate=(\d+)/);
          const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
          const pcmBuffer = base64ToArrayBuffer(audioData);
          const pcm16 = new Int16Array(pcmBuffer);
          const wavBlob = pcmToWav(pcm16, sampleRate);
          const audioUrl = URL.createObjectURL(wavBlob);
          ttsAudioCache.set(cacheKey, audioUrl);
          playAudioUrl(audioUrl);
        } else {
          throw new Error('No audio data returned');
        }
      } catch (err) {
        if (state.ttsLoadingKey === key) state.ttsLoadingKey = null;
        updatePlayAllButton();
        updateSentenceAudioIcons();
        showToast('AI 美音暂不可用，已切换为浏览器朗读', 'info');
        if (key === 'all') {
          state.isPlayingAll = true;
          updatePlayAllButton();
        }
        fallbackBrowserSpeak(text, () => {
          state.isPlayingAll = false;
          updatePlayAllButton();
          if (onEnd) onEnd();
        });
      }
    }

    function togglePlayAll() {
      if (state.isPlayingAll || state.ttsLoadingKey === 'all') {
        stopSpeech();
        return;
      }
      const essay = getCurrentEssay();
      const fullEn = getFullText(essay, 'en');
      speakWithAI(fullEn, { key: 'all' });
    }

    function updatePlayAllButton() {
      const icon = document.getElementById('play-all-icon');
      const text = document.getElementById('play-all-text');
      const btn = document.getElementById('btn-play-all');
      if (!btn) return;
      if (state.ttsLoadingKey === 'all') {
        icon.textContent = '⏳';
        text.textContent = '生成美音...';
        btn.classList.add('ring-2', 'ring-indigo-400');
      } else if (state.isPlayingAll) {

        text.textContent = '停止朗读';
        btn.classList.add('ring-2', 'ring-indigo-500');

    function updateSentenceAudioIcons() {
      document.querySelectorAll('[data-sent-audio]').forEach(btn => {
        const key = btn.dataset.sentAudio;
        if (state.ttsLoadingKey === key) {

    function cycleVoice() {
      stopSpeech();
      const idx = AI_VOICES.findIndex(v => v.id === state.ttsVoice);
      const next = AI_VOICES[(idx + 1) % AI_VOICES.length];
      state.ttsVoice = next.id;
      document.getElementById('voice-label').textContent = next.label;
      showToast(`已切换音色：${next.label}（${next.desc}）`);
    }

    function cycleSpeechRate() {
      const rates = [0.8, 1.0, 1.2];
      const nextIdx = (rates.indexOf(state.speechRate) + 1) % rates.length;
      state.speechRate = rates[nextIdx];
      document.getElementById('btn-speed').textContent = state.speechRate.toFixed(1) + 'x';
      if (currentAudioEl) {
        currentAudioEl.playbackRate = state.speechRate;
      }
      showToast(`朗读语速已设为 ${state.speechRate.toFixed(1)}x`);
    }

    // =========================================================================
    // 4.5 CLICK-TO-LOOKUP DICTIONARY (Contextual Meaning, US IPA & Audio)
    // =========================================================================
    function renderInteractiveEnglish(text, sentenceIndex) {
      // Split text preserving words (including hyphenated/accented/apostrophe words) and punctuation
      const tokens = text.split(/([A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*)/);
      return tokens.map(token => {
        if (/^[A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*$/.test(token)) {
          const safeWord = token.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          return `<span onclick="lookupWord('${safeWord}', ${sentenceIndex}, event)" title="点击查词：${escapeHtml(token)}" class="cursor-pointer rounded px-0.5 -mx-0.5 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors">${escapeHtml(token)}</span>`;
        }
        return escapeHtml(token);
      }).join('');
    }

    async function lookupWord(word, sentenceIdx, event) {
      if (event) event.stopPropagation();
      const essay = getCurrentEssay();
      const contextSentence = (sentenceIdx >= 0 && essay.sentences[sentenceIdx])
        ? essay.sentences[sentenceIdx].en
        : '';

      const cleanWord = word.trim();
      const cacheKey = `${cleanWord.toLowerCase()}::${sentenceIdx >= 0 ? essay.id + '-' + sentenceIdx : 'general'}`;

      openWordModal({ word: cleanWord, loading: true });

      if (wordDictCache.has(cacheKey)) {
        openWordModal({ ...wordDictCache.get(cacheKey), loading: false });
        return;
      }

      try {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;
        const prompt = `你是一位专业的中国考研/四六级英语名师。请解释英语单词 "${cleanWord}"${contextSentence ? ` 在以下句子中的含义：\n"${contextSentence}"` : ''}。\n要求：\n1. phonetic 给出标准美式音标（例如 /prəˈstɪdʒəs/）。\n2. pos 给出该词在句中的词性缩写（例如 adj. / v. / n.）。\n3. meaning 给出简洁精准的中文释义（优先贴合当前句意，如有其他高频义项可用分号简要补充）。\n4. collocation 如果该词在句中构成高频固定搭配或词组，请提取出来并附简短中文（例如 "on behalf of 代表"），否则留空字符串。\n5. tip 一句话记忆技巧或写作高分替换词（25字以内）。`;

        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                word: { type: "STRING" },
                phonetic: { type: "STRING" },
                pos: { type: "STRING" },
                meaning: { type: "STRING" },
                collocation: { type: "STRING" },
                tip: { type: "STRING" }
              },
              required: ["word", "phonetic", "pos", "meaning"]
            }
          }
        };

        const result = await fetchGeminiWithRetry(apiUrl, payload);
        const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!jsonText) throw new Error('Empty dictionary response');
        const parsed = JSON.parse(jsonText);
        const entry = {
          word: parsed.word || cleanWord,
          phonetic: parsed.phonetic || '',
          pos: parsed.pos || '',
          meaning: parsed.meaning || '暂无释义',
          collocation: parsed.collocation || '',
          tip: parsed.tip || ''
        };
        wordDictCache.set(cacheKey, entry);

        // Only update modal if it's still open
        const backdrop = document.getElementById('word-modal-backdrop');
        if (backdrop && !backdrop.classList.contains('hidden')) {
          openWordModal({ ...entry, loading: false });
        }
      } catch (err) {
        openWordModal({
          word: cleanWord,
          loading: false,
          error: '查词服务暂时繁忙，你可以先点击右上角听发音，或稍后重试。'
        });
      }
    }

                <span>🔊</span>

          <div class="mt-4 space-y-3">
            <div>
              <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">语境释义</div>

            ` : ''}

            ${data.tip ? `
              <div class="p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-100 dark:border-amber-900/40">

    function closeWordModal() {
      const backdrop = document.getElementById('word-modal-backdrop');
      if (backdrop) {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }
    }
    // =========================================================================
    // 5. NAVIGATION & GLOBAL CONTROLS
    // =========================================================================
    function selectEssay(id) {
      stopSpeech();
      state.currentEssayId = id;
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      state.dictationResult = null;
      toggleMobileSidebar(false);
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateEssay(delta) {
      const nextId = state.currentEssayId + delta;
      if (nextId >= 1 && nextId <= ESSAYS.length) {
        selectEssay(nextId);
      }
    }

    function switchMode(newMode) {
      stopSpeech();
      state.mode = newMode;
      renderAll();
    }

    function toggleEssayMastered() {
      const id = state.currentEssayId;
      if (state.masteredEssays.has(id)) {
        state.masteredEssays.delete(id);
        showToast('已取消掌握标记');
      } else {
        state.masteredEssays.add(id);
        showToast(`太棒了！第 ${id} 篇已标记为掌握 🎉`, 'success');
      }
      renderSidebar();
      renderHeader();
    }

    function toggleMobileSidebar(show) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (show) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      document.documentElement.classList.toggle('dark', state.darkMode);
      document.getElementById('theme-icon').textContent = state.darkMode ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = state.darkMode ? '浅色模式' : '深色模式';
    }

    // =========================================================================
    // 6. RENDERING FUNCTIONS

    function renderAll() {
      renderSidebar();
      renderHeader();
      renderFooter();
      renderWorkspace();
    }

      const listEl = document.getElementById('essay-list');
      const masteredCount = state.masteredEssays.size;

          <button onclick="selectEssay(${essay.id})" class="w-full text-left p-3 rounded-xl transition-all flex items-start gap-3 ${

      document.getElementById('btn-next-essay').disabled = state.currentEssayId >= ESSAYS.length;

    function renderWorkspace() {
      const workspace = document.getElementById('workspace');

      if (state.mode === 'sentences') {
        workspace.innerHTML = buildSentencesView(essay);

        workspace.innerHTML = buildClozeView(essay);
      } else if (state.mode === 'dictation') {

    // =========================================================================
    // 7. MODE 1: SENTENCE-BY-SENTENCE MEMORIZATION
    // =========================================================================
    function setSentenceDisplayMode(mode) {
      state.sentenceDisplayMode = mode;
      state.revealedSentences.clear();
      renderWorkspace();
    }

    function toggleRevealSentence(key) {
      if (state.revealedSentences.has(key)) {
        state.revealedSentences.delete(key);
      } else {
        state.revealedSentences.add(key);
      }
      renderWorkspace();
    }

    function toggleStarSentence(key, event) {
      event.stopPropagation();
      if (state.starredSentences.has(key)) {
        state.starredSentences.delete(key);
      } else {
        state.starredSentences.add(key);
      }
      renderWorkspace();
    }

    function speakSentence(idx, event) {
      event.stopPropagation();
      const key = `sent-${idx}`;
      if (state.playingKey === key || state.ttsLoadingKey === key) {
        stopSpeech();
        return;
      }
      const essay = getCurrentEssay();
      const s = essay.sentences[idx];
      if (s) speakWithAI(s.en, { key });

        }

        const sectionHeader = s.label
          ? `<div class="mt-5 mb-2 flex items-center gap-2"><span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span><span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 px-2">${escapeHtml(s.label)}</span><span class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></span></div>`
          : '';

        return `
          ${sectionHeader}
          <div onclick="toggleRevealSentence('${key}')" class="group cursor-pointer bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 border transition-all mb-3 ${
            isStarred
              ? 'border-amber-300 dark:border-amber-700/80 ring-1 ring-amber-200/60 dark:ring-amber-900/40'
              : 'border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700'
          } shadow-xs hover:shadow-sm">
            <div class="flex items-start justify-between gap-3 mb-2">
              <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                第 ${idx + 1} 句 · P${s.p}
              </span>
              <div class="flex items-center gap-1.5">
                <button data-sent-audio="sent-${idx}" onclick="speakSentence(${idx}, event)" title="美音朗读此句" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 transition-colors">
                  ${state.ttsLoadingKey === `sent-${idx}` ? '⏳' : state.playingKey === `sent-${idx}` ? '⏹️' : '🔊'}
                </button>
                <button onclick="toggleStarSentence('${key}', event)" title="标记难点句" class="p-1.5 rounded-lg transition-colors ${
                  isStarred
                    ? 'text-amber-500 bg-amber-50 dark:bg-amber-950/50'
                    : 'text-slate-400 hover:text-amber-500 hover:bg-slate-100 dark:hover:bg-slate-800'
                }">
                  ${isStarred ? '★' : '☆'}
                </button>
              </div>
            </div>
            ${enContent}
            ${zhContent}
          </div>
        `;
      }).join('');

      // Footer Block (Sign-off)
      const footerHtml = `
        <div class="bg-slate-100/80 dark:bg-slate-900/60 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 mt-4 space-y-1.5">
          <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">结尾落款</div>
          ${essay.footerLines.map(line => `
            <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-0.5">
              <span class="font-semibold text-sm sm:text-base text-slate-900 dark:text-slate-100">${escapeHtml(line.en)}</span>
              <span class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">${escapeHtml(line.zh)}</span>
            </div>
          `).join('')}
        </div>
      `;

      return toolbar + headerHtml + cardsHtml + footerHtml;
    }

    // =========================================================================
    // 8. MODE 2: CLOZE / FILL-IN-THE-BLANKS
    // =========================================================================
    function setClozeDifficulty(val) {
      state.clozeDifficulty = val;
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      renderWorkspace();
    }

    function setClozeInputMode(mode) {
      state.clozeInputMode = mode;
      state.clozeChecked = false;
      renderWorkspace();
    }

    function reshuffleCloze() {
      state.clozeSeed += 1;
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      renderWorkspace();
      showToast('已重新随机生成挖空题目');
    }

    function toggleClozeBlank(blankKey) {
      if (state.clozeRevealed.has(blankKey)) {
        state.clozeRevealed.delete(blankKey);
      } else {
        state.clozeRevealed.add(blankKey);
      }
      renderWorkspace();
    }

    function revealAllCloze() {
      document.querySelectorAll('[data-cloze-key]').forEach(el => {
        state.clozeRevealed.add(el.dataset.clozeKey);
      });
      renderWorkspace();
    }

    function hideAllCloze() {
      state.clozeRevealed.clear();
      state.clozeTyped = {};
      state.clozeChecked = false;
      renderWorkspace();
    }

    function handleClozeTyping(key, value) {
      state.clozeTyped[key] = value;
    }

    function checkClozeTyping() {
      state.clozeChecked = true;
      renderWorkspace();
    }

    function buildClozeView(essay) {
      const diffs = [
        { val: 0.25, label: '简单 (25%)' },
        { val: 0.35, label: '标准 (35%)' },
        { val: 0.55, label: '挑战 (55%)' }
      ];

      let seed = essay.id * 1000 + state.clozeSeed * 37;
      let totalBlanks = 0;
      let correctTyped = 0;

      // Group sentences by paragraph
      const paraMap = new Map();
      essay.sentences.forEach((s, idx) => {
        if (!paraMap.has(s.p)) paraMap.set(s.p, []);
        paraMap.get(s.p).push({ ...s, idx });
      });

      const paragraphsHtml = Array.from(paraMap.entries()).map(([pNum, sList]) => {
        const renderedSentences = sList.map(s => {
          // Tokenize preserving punctuation and spaces
          const tokens = s.en.split(/([A-Za-zÀ-ÿ'-]+)/);
          return tokens.map((token, tIdx) => {
            if (!/^[A-Za-zÀ-ÿ'-]+$/.test(token)) return escapeHtml(token);
            const cleanLower = token.toLowerCase();
            const isCandidate = token.length >= 4 && !STOP_WORDS.has(cleanLower);
            const shouldBlank = isCandidate && seededRandom(seed++) < state.clozeDifficulty;

            if (!shouldBlank) return escapeHtml(token);

            totalBlanks++;
            const bKey = `${essay.id}-${s.idx}-${tIdx}`;

            if (state.clozeInputMode === 'click') {
              const isRev = state.clozeRevealed.has(bKey);
              return `<button type="button" data-cloze-key="${bKey}" onclick="toggleClozeBlank('${bKey}')" class="inline-block mx-0.5 px-2 py-0.5 rounded-lg font-semibold align-baseline transition-all border ${
                isRev
                  ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700'
                  : 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 dark:hover:bg-indigo-900/60'
              }">${isRev ? escapeHtml(token) : `${escapeHtml(token[0])}${'_'.repeat(Math.min(token.length - 1, 5))}`}</button>`;
            } else {
              const userVal = state.clozeTyped[bKey] || '';
              const isCorrect = userVal.trim().toLowerCase() === token.toLowerCase();
              if (state.clozeChecked && isCorrect) correctTyped++;
              const widthCh = Math.max(token.length + 2, 6);
              let inputBorder = 'border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white';
              if (state.clozeChecked) {
                inputBorder = isCorrect
                  ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300'
                  : 'border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300';
              }
              const correctionBadge = (state.clozeChecked && !isCorrect)
                ? `<span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 ml-1">(${escapeHtml(token)})</span>`
                : '';
              return `<span class="inline-flex items-baseline mx-0.5"><input type="text" data-cloze-key="${bKey}" value="${escapeHtml(userVal)}" oninput="handleClozeTyping('${bKey}', this.value)" placeholder="${escapeHtml(token[0])}..." style="width:${widthCh}ch" class="px-1.5 py-0.5 text-sm sm:text-base rounded-lg border focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors ${inputBorder}" />${correctionBadge}</span>`;
            }
          }).join('');
        }).join(' ');

        const zhPara = sList.map(s => s.zh).join('');
        return `
          <div class="mb-5 last:mb-0">
            <p class="text-base sm:text-[17px] leading-[2.1] text-slate-800 dark:text-slate-100">${renderedSentences}</p>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2 pl-3 border-l-2 border-slate-200 dark:border-slate-700">${escapeHtml(zhPara)}</p>
          </div>
        `;
      }).join('');

      const scoreBanner = (state.clozeInputMode === 'type' && state.clozeChecked)
        ? `<div class="mb-4 p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800 flex items-center justify-between">
            <span class="text-sm font-semibold text-indigo-800 dark:text-indigo-200">批改结果：答对 ${correctTyped} / ${totalBlanks} 空（正确率 ${totalBlanks ? Math.round((correctTyped / totalBlanks) * 100) : 0}%）</span>
            <button onclick="hideAllCloze()" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline">清空重填</button>
          </div>`
        : '';

      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 border border-slate-200 dark:border-slate-800 shadow-xs mb-5 flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-1.5">
            ${diffs.map(d => `
              <button onclick="setClozeDifficulty(${d.val})" class="px-3 py-1.5 rounded-xl text-xs font-medium transition-colors ${
                state.clozeDifficulty === d.val
                  ? 'bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 ring-1 ring-indigo-300 dark:ring-indigo-700'
                  : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
              }">${d.label}</button>
            `).join('')}
            <span class="mx-1 text-slate-300 dark:text-slate-700">|</span>
            <button onclick="setClozeInputMode('click')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${state.clozeInputMode === 'click' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">点击显隐</button>
            <button onclick="setClozeInputMode('type')" class="px-3 py-1.5 rounded-xl text-xs font-medium ${state.clozeInputMode === 'type' ? 'bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">拼写填空</button>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="reshuffleCloze()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700">🔀 换一批空</button>
            ${state.clozeInputMode === 'click'
              ? `<button onclick="revealAllCloze()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-emerald-600 text-white hover:bg-emerald-700">全部显示</button>
                 <button onclick="hideAllCloze()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700">全部隐藏</button>`
              : `<button onclick="checkClozeTyping()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700">✓ 检查拼写</button>`
            }
          </div>
        </div>

        ${scoreBanner}

        <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-7 border border-slate-200 dark:border-slate-800 shadow-xs">
          <div class="mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 space-y-1">
            ${essay.headerLines.map(l => `<div class="font-semibold text-slate-900 dark:text-slate-100">${escapeHtml(l.en)}</div>`).join('')}
          </div>
          ${paragraphsHtml}
          <div class="mt-5 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-1">
            ${essay.footerLines.map(l => `<div class="font-semibold text-slate-900 dark:text-slate-100">${escapeHtml(l.en)}</div>`).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. MODE 3: FULL DICTATION & WORD-LEVEL DIFF CHECKER
    // =========================================================================
    function handleDictationInput(val) {
      state.dictationDrafts[state.currentEssayId] = val;
    }

    function clearDictation() {
      state.dictationDrafts[state.currentEssayId] = '';
      state.dictationResult = null;
      renderWorkspace();
    }

    // Longest Common Subsequence (LCS) word-level diff
    function computeWordDiff(expectedText, userText) {
      const normalize = w => w.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, '');
      const expWords = expectedText.trim().split(/\s+/).filter(Boolean);
      const usrWords = userText.trim().split(/\s+/).filter(Boolean);

      const m = expWords.length;
      const n = usrWords.length;
      const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (normalize(expWords[i - 1]) === normalize(usrWords[j - 1])) {
            dp[i][j] = dp[i - 1][j - 1] + 1;
          } else {
            dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          }
        }
      }

      const diff = [];
      let i = m, j = n;
      let matchedCount = 0;

      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && normalize(expWords[i - 1]) === normalize(usrWords[j - 1])) {
          diff.push({ type: 'same', text: expWords[i - 1] });
          matchedCount++;
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          diff.push({ type: 'extra', text: usrWords[j - 1] });
          j--;
        } else {
          diff.push({ type: 'missing', text: expWords[i - 1] });
          i--;
        }
      }

      diff.reverse();
      const accuracy = m > 0 ? Math.round((matchedCount / m) * 100) : 0;
      return { diff, accuracy, matchedCount, totalExpected: m };
    }

    function gradeDictation() {
      const essay = getCurrentEssay();
      const userText = (state.dictationDrafts[essay.id] || '').trim();
      if (!userText) {
        showToast('请先在下方默写框中输入英文内容', 'error');
        return;
      }
      const expectedText = getFullText(essay, 'en');
      state.dictationResult = computeWordDiff(expectedText, userText);
      renderWorkspace();
      showToast(`批改完成！匹配准确率为 ${state.dictationResult.accuracy}%`, state.dictationResult.accuracy >= 85 ? 'success' : 'info');
    }

    function buildDictationView(essay) {
      const fullZh = getFullText(essay, 'zh');
      const draft = state.dictationDrafts[essay.id] || '';
      const wordCount = draft.trim() ? draft.trim().split(/\s+/).length : 0;

      let resultHtml = '';
      if (state.dictationResult) {
        const { diff, accuracy, matchedCount, totalExpected } = state.dictationResult;
        const renderedDiff = diff.map(item => {
          if (item.type === 'same') {
            return `<span class="text-emerald-700 dark:text-emerald-400">${escapeHtml(item.text)}</span>`;
          } else if (item.type === 'missing') {
            return `<span class="px-1 rounded bg-amber-100 dark:bg-amber-900/60 text-amber-800 dark:text-amber-200 underline decoration-amber-500 font-medium" title="漏写单词">${escapeHtml(item.text)}</span>`;
          } else {
            return `<span class="px-1 rounded bg-rose-100 dark:bg-rose-900/60 text-rose-700 dark:text-rose-300 line-through" title="多写或拼错">${escapeHtml(item.text)}</span>`;
          }
        }).join(' ');

        resultHtml = `
          <div class="mt-5 bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
              <div class="flex items-center gap-3">
                <span class="text-lg font-bold ${accuracy >= 90 ? 'text-emerald-600' : accuracy >= 70 ? 'text-indigo-600' : 'text-amber-600'}">
                  准确率 ${accuracy}%
                </span>
                <span class="text-xs text-slate-500">正确匹配 ${matchedCount} / ${totalExpected} 词</span>
              </div>
              <div class="flex items-center gap-3 text-xs">
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>正确</span>
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>漏写</span>
                <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>拼错/多写</span>
              </div>
            </div>
            <div class="text-sm sm:text-base leading-loose">${renderedDiff}</div>
          </div>
        `;
      }

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <!-- Chinese Prompt Card -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs flex flex-col">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100 dark:border-slate-800">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">参考中文提示</h3>
              <span class="text-xs text-slate-400">对照中文默写英文</span>
            </div>
            <div class="text-sm sm:text-[15px] leading-relaxed text-slate-700 dark:text-slate-300 whitespace-pre-line flex-1">
              ${escapeHtml(fullZh)}
            </div>
          </div>

          <!-- English Dictation Input Card -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-xs flex flex-col">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100 dark:border-slate-800">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">英文默写区</h3>
              <span class="text-xs text-slate-500">已输入 ${wordCount} 词</span>
            </div>
            <textarea
              id="dictation-textarea"
              oninput="handleDictationInput(this.value)"
              placeholder="在此处从头到尾默写英文范文（包含抬头、正文和落款）..."
              rows="12"
              class="w-full flex-1 p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-sm sm:text-base leading-relaxed text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-y"
            >${escapeHtml(draft)}</textarea>
            <div class="mt-4 flex items-center justify-between gap-2">
              <button onclick="clearDictation()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
                清空重写
              </button>
              <button onclick="gradeDictation()" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm">
                ✨ 一键批改比对
              </button>
            </div>
          </div>
        </div>
        ${resultHtml}
      `;
    }

    // =========================================================================
    // 10. MODE 4: FULL TEXT READER
    // =========================================================================
    function copyEssayText(lang) {
      const essay = getCurrentEssay();
      copyText(getFullText(essay, lang), lang === 'en' ? '已复制完整英文范文' : '已复制完整中文译文');
    }

    function buildFullTextView(essay) {
      const fullEn = getFullText(essay, 'en');
      const fullZh = getFullText(essay, 'zh');
      const wordCount = fullEn.trim().split(/\s+/).length;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <!-- Complete English Version -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-800 shadow-xs">
            <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">完整纯英文版</h3>
                <p class="text-xs text-slate-500">共约 ${wordCount} 词 · 适合通读与背诵核对</p>
              </div>
              <button onclick="copyEssayText('en')" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/60">
                📋 复制英文
              </button>
            </div>
            <div class="text-base leading-relaxed text-slate-800 dark:text-slate-100 whitespace-pre-line font-normal">
              ${renderInteractiveEnglish(fullEn, -1)}
            </div>
          </div>

          <!-- Complete Chinese Version -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-6 border border-slate-200 dark:border-slate-800 shadow-xs">
            <div class="flex items-center justify-between gap-2 pb-3 mb-4 border-b border-slate-100 dark:border-slate-800">
              <div>
                <h3 class="font-bold text-sm sm:text-base text-slate-900 dark:text-white">完整中文参考译文</h3>
                <p class="text-xs text-slate-500">对照理解行文逻辑</p>
              </div>
              <button onclick="copyEssayText('zh')" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">
                📋 复制中文
              </button>
            </div>
            <div class="text-sm sm:text-[15px] leading-relaxed text-slate-600 dark:text-slate-300 whitespace-pre-line">
              ${escapeHtml(fullZh)}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. INITIALIZE APPLICATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // Pre-load voices for Web Speech API
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      renderAll();
    });
  </script>
</body>
</html>
